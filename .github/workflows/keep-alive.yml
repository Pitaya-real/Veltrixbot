name: Keep Render Bot Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://veltrixbot-gjf4.onrender.com
          echo "HTTP status: $status"
          test "$status" -lt 500
          
